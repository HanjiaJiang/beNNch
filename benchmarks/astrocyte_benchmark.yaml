include-path:
  - ../helpers/
  - ../config/

# model-specific name and output path
name: astrocyte
outpath: ../outpath/test
parameterset:
      name: model_commands
      parameter:
          - {name: run_file, type: string, _: "$jube_wp_abspath/astrocyte_benchmark.py"}
          - {name: log_path, type: string, _: "${jube_wp_abspath}"}
fileset:
# load and copy model-specific files
    name: model_files
    copy:
      - $model_path/astrocyte_benchmark.py
      - $model_path/network.py

# This subsituteset maps the parameters that were defined in this yaml
# file to the target patterns that JUBE will search for in the
# simulation files. The pattern file is astrocyte_benchmark.py. The
# source pattern will be replaced by the values.
substituteset:
      name: model_substitutions
      iofile: {in: astrocyte_benchmark.py, out: astrocyte_benchmark.py}
      sub:
      - {source: "{model_name}", dest: $model_name}
      - {source: "{num_vps}", dest: $num_vps}
      - {source: "{model_time_sim}", dest: $model_time_sim}
      - {source: "{model_time_presim}", dest: $model_time_presim}
      - {source: "{scale_N}", dest: $scale}
      - {source: "{rng_seed}", dest: $rng_seed}
      - {source: "{pool_size}", dest: $astro_pool_size}
      - {source: "{pool_type}", dest: $astro_pool_type}

step:
# build step
    - name: build
      export: true
      use:
      - from: user_config.yaml
        _: user_config
      - from: astrocyte_benchmark_config.yaml
        _: file_paths,model_parameters,software_parameters
      - from: helpers.yaml
        _: slurm_build,run_build,files,sub_build_job
      do:
        - build --get --silent ${simulator} ${version} ${variant} ${suffix} && export DEP=`$submit_cmd --parsable $job_file`

# benchmark step
    - name: bench
      depend: build
      use:
      - model_commands, model_files, model_substitutions
      - from: user_config.yaml
        _: user_config
      - from: astrocyte_benchmark_config.yaml
        _: file_paths,model_parameters,machine_parameters,software_parameters
      - from: helpers.yaml
        _: slurm_bench,run_benchmark,files,sub_bench_job,scaling_experiment,init_job_file_variables
      do:
        done_file: $ready_file
        _: $submit_cmd --dependency=afterok:$$DEP $job_file

# analysis step
analyser:
      name: analyse
      use:
        - from: helpers.yaml
          _: timer_pattern
      analyse:
        step: bench
        file: timer_data.txt

# result step
result:
      name: result
      use: analyse
      table:
        name: result_table
        style: csv
        sort: number
        column:
        - rng_seed
        - num_nodes
        - threads_per_task
        - tasks_per_node
        - model_time_sim
        - time_construction_create
        - time_construction_connect
        - time_simulate
        - time_collocate_spike_data
        - time_communicate_spike_data
        - time_deliver_spike_data
        - time_update
        - time_communicate_target_data
        - time_gather_spike_data
        - time_gather_target_data
        - time_communicate_prepare
        - time_deliver_secondary_data
        - time_gather_secondary_data
        - py_time_create
        - py_time_connect
        - network_size
        - N_ex
        - N_in
        - N_astro
        - num_connections
        - local_spike_counter
        - pool_size
        - pool_type
        - base_memory
        - node_memory
        - network_memory
        - init_memory
        - total_memory
