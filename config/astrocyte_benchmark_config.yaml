parameterset:
    - name: file_paths
      parameter:
       - {name: base_path, type: string, _: "/p/project1/cjinb33/jiang4/benchmark/beNNch"}  # path where main repository is stored
       - {name: model_path, type: string, _: "/p/project1/cjinb33/jiang4/benchmark/beNNch/models/astrocyte"} # absolute path to the benchmark model

    - name: model_parameters
      parameter:
       - {name: model_name, type: string, _: "Bernoulli"}  # Sparse, Synchronous, Surrogate, Bernoulli, Fixed-indegree, Fixed-outdegree, Fixed-total-number
       - {name: model_time_sim, type: float, _: "10000."}  # biological time to be simulated in ms
       - {name: model_time_presim, type: float, _: "1000."}  # presimulation time for avoiding initial transients in ms
       - {name: scale_N, type: float, _: "1."}  # scale of the model
       - {name: rng_seed, type: int, _: "1,2,3,4"}  # rng seed for NEST, accepts a list in the format a,b,c,... for generating multiple runs
       - {name: scaling_type, _: "strong"}  # can be either weak or strong
       - {name: astro_pool_size, _: "10"}  # astrocyte pool size for each neuron
       - {name: astro_pool_type, _: "random"}  # astrocyte pool type for each neuron

    - name: machine_parameters
      parameter:
       - {name: num_nodes, type: int, _: "1,2,3,4"}  # number of nodes, accepts a list in the format a,b,c,... for generating multiple runs
       - {name: tasks_per_node, type: int, _: "2"}  # number of (MPI) tasks per node, accepts a list in the format a,b,c,... for generating multiple runs
       - {name: threads_per_task, type: int, _: "64"}  # number of threads per task, accepts a list in the format a,b,c,... for generating multiple runs
       - {name: walltime, type: string, _: "01:00:00"}  # wall time for the job in format hh:mm:ss
       - {name: affinity, type: string, separator: ";", _: "--cpu-bind=verbose,threads --distribution=block:cyclic:fcyclic --threads-per-core=1"}  # processor affinity/pinning
    - name: software_parameters
      parameter:
       - {name: simulator, _: "nest-simulator"}  # simulator to be installed (plan file must be provided)
       - {name: version, _: "3.8"}  # simulator version
       - {name: variant, _: "default"}  # version variant
       - {name: suffix, _: ""}  # custom suffix for identification of simulator installation
       - {name: buildermod, _: ""} # absolute path to Builder modules folder
